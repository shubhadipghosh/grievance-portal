spring:
  application:
    name: grievance-portal

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/grievance
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug

app:
  # Zone used for citizen-facing display formatting (ticket number
  # year). Everything else runs in UTC.
  display-zone: Asia/Kolkata

grievance:
  sla:
    # Fraction of the category SLA granted when a grievance is
    # reopened. Must be 0 < factor <= 1.0 — a reopen means the first
    # resolution failed, so the window is shorter, never longer.
    reopen-factor: 0.5
