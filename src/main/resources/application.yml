spring:
  application:
    name: grievance-portal

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/grievance
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug