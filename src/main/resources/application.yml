spring:
  application:
    name: grievance-portal

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/grievance
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug

app:
  # Zone used for citizen-facing display formatting (ticket number
  # year). Everything else runs in UTC.
  display-zone: Asia/Kolkata
  # Secure flag on the SESSION and XSRF-TOKEN cookies. Set COOKIE_SECURE=false
  # only for local development over plain HTTP.
  secure-cookies: ${COOKIE_SECURE:true}

grievance:
  sla:
    # Fraction of the category SLA granted when a grievance is
    # reopened. Must be 0 < factor <= 1.0 — a reopen means the first
    # resolution failed, so the window is shorter, never longer.
    reopen-factor: 0.5

otp:
  # Digits in a login code.
  code-length: 6
  # How long a code stays valid after it is sent.
  validity: 15m
  # Wrong codes allowed before the code is burned (DB caps this at 3).
  max-attempts: 3
  # Minimum gap between sends to one phone.
  resend-cooldown: 60s
  # Send caps, over fixed windows starting on the UTC day / hour.
  max-sends-per-phone-per-day: 5
  max-sends-per-ip-per-hour: 20
